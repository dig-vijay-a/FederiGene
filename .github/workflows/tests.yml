name: FederiGene Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install backend dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
        pip install pytest httpx pytest-cov
    - name: Run Pytest
      run: |
        cd Backend
        python -m pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm install
    - name: Run Vitest
      run: |
        cd Frontend
        npm run test -- --run
