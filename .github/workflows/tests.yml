name: FederiGene Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install backend dependencies
      run: |
        cd Backend
        pip install -r requirements.txt
        pip install pytest httpx pytest-cov
    - name: Run Pytest
      run: |
        cd Backend
        python -m pytest tests/ -v --junitxml=pytest-results.xml
    
    # This step grabs the results and creates a beautiful markdown summary table on GitHub!
    - name: Publish Backend Test Summary
      uses: mikepenz/action-junit-report@v5
      if: always() # Run this even if tests fail so you still get the summary report
      with:
        report_paths: 'Backend/pytest-results.xml'
        summary: 'true'

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm install
    - name: Run Vitest
      run: |
        cd Frontend
        npm run test -- --run --reporter=junit --outputFile=vitest-results.xml
        
    # This step grabs the Vitest results and adds them to the GitHub summary page
    - name: Publish Frontend Test Summary
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: 'Frontend/vitest-results.xml'
        summary: 'true'
